# Keeps medvoice-translator.streamlit.app awake by actually clicking the
# Streamlit wake-up button, not just pinging the URL.
#
# This file must live at:  .github/workflows/keep-medvoice-awake.yml
# The companion script at: scripts/wake_streamlit.py
#
# Cost: $0. GitHub Actions is free and unmetered on public repositories.

name: Keep MedVoice Translator Awake

on:
  schedule:
    # Every 6 hours, at 00:00, 06:00, 12:00 and 18:00 UTC.
    # Tighten to "0 */4 * * *" if the app still sleeps.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: pip install "selenium>=4.20"

      - name: Run wake script
        run: python scripts/wake_streamlit.py
